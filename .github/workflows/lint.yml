name: lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: shellcheck
        run: shellcheck install.sh uninstall.sh bin/protonauth-list

      - name: JSON
        run: jq -e '.schemaVersion == 1 and (.id | startswith("omarchy.") | not)' manifest.json

      - name: Manifest and helper versions match
        run: |
          test "$(jq -r .version manifest.json)" = "$(/usr/bin/python3 bin/protonauth_list.py --version | awk '{print $2}')"

      - name: Manifest id matches Panel.qml and scripts
        run: |
          id=$(jq -r .id manifest.json)
          grep -q "pluginId: \"$id\"" Panel.qml
          grep -q "moduleName: \"$id\"" BarWidget.qml
          grep -q "PLUGIN_ID=\"$id\"" install.sh
          grep -q "PLUGIN_ID=\"$id\"" uninstall.sh

      - name: No symlinks (Omarchy refuses them)
        run: test -z "$(find . -path ./.git -prune -o -type l -print)"

      - name: Python helper compiles
        run: python3 -m py_compile bin/protonauth_list.py bin/protonauth_clipboard.py

      - name: Python lint (ruff)
        run: pipx run ruff check bin/*.py

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Unit + ownership tests
        run: node --test tests/*.test.js

      - name: Synthetic Python helper and clipboard tests
        run: |
          python3 -m pip install cryptography
          python3 -m unittest discover -s tests -p 'test_*.py'
